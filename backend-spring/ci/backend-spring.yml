# Copy to <repo root>/.github/workflows/backend-spring.yml
name: backend-spring

on:
  push:
    branches: [main]
  pull_request:
    paths: ["backend-spring/**", ".github/workflows/backend-spring.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-spring-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-spring
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend-spring/pom.xml
      # Unit tests plus integration tests (Testcontainers starts Postgres with pgvector).
      - name: Build and test
        run: mvn -B verify
      - name: Docker image builds
        run: docker build -t jobcompass-api:ci .

  deploy:
    needs: test
    # Pushes to main and manual runs only. Never for pull requests: a self-hosted runner executes
    # whatever code it is given.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, jobcompass]
    concurrency:
      group: jobcompass-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Deploy API and frontend
        run: make up
