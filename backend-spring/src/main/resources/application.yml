spring:
  application:
    name: jobcompass-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/jobcompass}
    username: ${DATABASE_USER:jobcompass}
    password: ${DATABASE_PASSWORD:jobcompass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  jackson:
    # The React frontend already speaks snake_case (date_applied, job_url, ...).
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: always
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB

app:
  ollama:
    url: ${OLLAMA_URL:http://localhost:11434}
    model: ${REASONING_MODEL:qwen3.5:9b}
    embed-model: ${EMBED_MODEL:nomic-embed-text}
    num-ctx: ${OLLAMA_NUM_CTX:8192}
    timeout-seconds: 300
  cors-origins: ${CORS_ORIGINS:}

server:
  port: ${PORT:9500}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
      export:
        # Off by default so nothing leaves the box until you point it at Langfuse (see README).
        enabled: ${TRACING_EXPORT:false}
      headers:
        Authorization: ${OTLP_AUTHORIZATION:none}
