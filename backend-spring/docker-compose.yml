services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: jobcompass
      POSTGRES_USER: jobcompass
      POSTGRES_PASSWORD: jobcompass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobcompass"]
      interval: 5s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/jobcompass
      DATABASE_USER: jobcompass
      DATABASE_PASSWORD: jobcompass
      OLLAMA_URL: http://host.docker.internal:11434
      REASONING_MODEL: qwen3.5:9b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9500:9500"

volumes:
  pgdata:
