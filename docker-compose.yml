services:
  backend:
    build:
      context: ./backend
    container_name: jobcompass-backend      # unique name Caddy can resolve
    volumes:
      - ./backend:/app
    environment:
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - REASONING_MODEL=${REASONING_MODEL:-qwen3.5:9b}
      - WEEKLY_GOAL=${WEEKLY_GOAL:-10}
      - FOLLOW_UP_AFTER_DAYS=${FOLLOW_UP_AFTER_DAYS:-7}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3502/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default
      - caddy_net
    restart: unless-stopped

  frontend:
    build:
      context: .
      args:
        VITE_API_URL: /jobcompass/api
    container_name: jobcompass-frontend
    depends_on:
      - backend
    networks:
      - default
      - caddy_net
    restart: unless-stopped

networks:
  caddy_net:
    external: true